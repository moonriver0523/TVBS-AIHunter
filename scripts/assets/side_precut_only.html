<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>側錄初處理</title>
<style>
  :root {
    --bg:#14161a; --panel:#1d2027; --line:#2e333d; --fg:#e6e8ec; --dim:#9aa2b1;
    --accent:#4da3ff; --warn:#f0b429; --fail:#f2555a; --ok:#4cc38a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 10px 0 0; font-weight:600; }
  input[type=text] { background:#0e1013; color:var(--fg); border:1px solid var(--line);
                     border-radius:6px; padding:6px 9px; font:inherit; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#08121f; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  section { overflow:auto; padding:12px; }
  .mat { padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  .mat:hover { border-color:var(--accent); }
  .mat.on { border-color:var(--accent); background:#1a2634; }
  .mat .n { font-size:12px; word-break:break-all; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px;
         background:#2a2f38; color:var(--dim); margin-right:4px; }
  .tag.has { background:#1e3a2c; color:var(--ok); }
  .tag.warn { background:#3a2f14; color:var(--warn); }
  .note { font-size:12px; color:var(--dim); border-left:2px solid var(--line);
          padding-left:8px; margin:6px 0 12px; }
  label { display:block; font-size:12px; color:var(--dim); margin:9px 0 3px; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  #status { font-size:12px; color:var(--dim); margin-left:auto; max-width:50%; }
  #viewPrecut { display:grid; grid-template-columns:260px 1fr 340px; height:calc(100vh - 53px); overflow:hidden; }
  #pcMats { border-right:1px solid var(--line); }
  #pcMain { display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  #pcForm { border-left:1px solid var(--line); overflow:auto; }
  #pcPlayer { width:100%; max-height:220px; background:#000; border-radius:8px; flex-shrink:0; }
  #pcWave { width:100%; display:block; background:#0e1013; border:1px solid var(--line); border-radius:6px; margin:8px 0; cursor:pointer; flex-shrink:0; }
  #pcSegs { flex:1; overflow:auto; min-height:0; }
  #pcForm select { width:100%; background:#0e1013; color:var(--fg); border:1px solid var(--line);
                   border-radius:6px; padding:6px 9px; font:inherit; }
  #pcActions { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  #pcActions button { width:100%; }
  .pcseg { display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:7px 10px; margin-bottom:4px; cursor:pointer; }
  .pcseg.on { border-color:var(--accent); background:#182430; }
  .pcseg.ad { border-color:#5a2a2a; }
  .pcseg .meta { font-size:12px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:3px; }
  .pcseg .topic { font-size:15px; font-weight:600; line-height:1.35; color:var(--fg); }
  .pcseg .topic.empty { color:var(--dim); font-weight:400; }
  .pcgap { height:8px; margin:14px 6px 8px; border-top:1px dashed var(--line); }
  .pcpack { font-size:13px; font-weight:600; padding:4px 8px 8px; }
  .pcpack label { display:flex; align-items:center; gap:8px; margin:0; color:var(--fg); cursor:pointer; }</style>
</head>
<body>
<header>
  <h1>側錄初處理</h1>
  <input type="text" id="dir" size="52" placeholder="素材資料夾路徑">
  <button id="load">讀取</button>
  <span id="status"></span>
</header>

<main id="viewPrecut">
  <section id="pcMats"></section>
  <section id="pcMain">
    <video id="pcPlayer" controls preload="metadata"></video>
    <canvas id="pcWave" height="72"></canvas>
    <div id="pcSegs"></div>
  </section>
  <section id="pcForm">
    <div class="note" id="pcNote">不跑 ASR。分析用靜音＋下標 OCR，類型請人改。</div>
    <label>類型</label>
    <select id="pcKind">
      <option value="ad">廣告</option>
      <option value="anchor">主播</option>
      <option value="reporter">記者</option>
      <option value="interview">訪問</option>
      <option value="other">其他</option>
    </select>
    <label>主題（字卡，可改）</label>
    <input type="text" id="pcTopic" style="width:100%">
    <div class="row">
      <div><label>檔內起（HHMMSS）</label><input type="text" id="pcT0" placeholder="072344"></div>
      <div><label>檔內訖（HHMMSS）</label><input type="text" id="pcT1" placeholder="072344"></div>
    </div>
    <div id="pcTc" class="note"></div>
    <label style="display:flex;align-items:center;gap:6px;color:var(--fg)"><input type="checkbox" id="pcAccurate">精準重編（慢，切點對齊秒）</label>
    <label>合併輸出檔名（只出勾選用；自動帶「來源＋起始TC」字首，這裡填後段，留空＝「合併」）</label>
    <input type="text" id="pcMergeName" style="width:100%" placeholder="例：專訪片段 → CNN 170025 專訪片段.mp4">
    <div id="pcActions">
      <button id="pcAnalyze">分析</button>
      <button id="pcTranslate">翻譯主題</button>
      <button class="primary" id="pcExportAll">一鍵出全部非廣告</button>
      <button id="pcExportSel">只出勾選（合併一段）</button>
      <button id="pcInvert">全部取消選擇</button>
      <button id="pcSave">存回 PRECUT.json</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let LOADED_DIR = '';
const status = (t, err) => { $('status').textContent = t; $('status').style.color = err ? 'var(--fail)' : 'var(--dim)'; };

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({ detail: r.statusText }));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || '請求失敗'));
  return j;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmmss = s => pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(Math.floor(s % 60));
const sec2hhmmss6 = s => {
  s = Math.max(0, Math.round(Number(s) || 0));
  return pad(Math.floor(s / 3600)) + pad(Math.floor(s % 3600 / 60)) + pad(Math.floor(s % 60));
};
const hhmmss62sec = str => {
  const m = String(str || '').trim().match(/^(\d{2})(\d{2})(\d{2})$/);
  if (!m) return NaN;
  return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]);
};

let PC_MAT = null, PC_SEGS = [], PC_SEL = -1, pcSeek = null, pcTimer = null, pcExTimer = null, pcTrTimer = null, PC_MATS = [];
const KIND_ZH = {ad:'廣告', anchor:'主播', reporter:'記者', interview:'訪問', other:'其他'};
const KIND_COLOR = {ad:'#f2555a', anchor:'#4da3ff', reporter:'#f0b429', interview:'#4cc38a', other:'#9aa2b1'};

function pcFmt(tc) { return tc ? tc.slice(0,2)+':'+tc.slice(2,4)+':'+tc.slice(4,6) : ''; }

function renderPcMats(list) {
  PC_MATS = list;
  $('pcMats').innerHTML = list.map((m,i) =>
    `<div class="mat" data-i="${i}"><div class="n">${esc(m.name)}</div>
     <span class="tag">${m.kind === 'numbered' ? '#' + m.material_no : m.kind === 'side' ? '側錄' : '無編號'}</span>
     ${m.offset ? `<span class="tag has">offset ${hhmmss(m.offset)}</span>` : `<span class="tag warn">無 6 碼 TC</span>`}
    </div>`).join('');
  $('pcMats').querySelectorAll('.mat').forEach(el => el.onclick = () => pcPick(list[+el.dataset.i]));
}

async function loadDir() {
  const dir = $('dir').value.trim();
  status('讀取中…');
  try {
    const j = await api('/api/materials?dir=' + encodeURIComponent(dir));
    const sameDir = LOADED_DIR === dir;
    LOADED_DIR = dir;
    const keepName = sameDir && PC_MAT && j.materials.some(m => m.name === PC_MAT.name) ? PC_MAT.name : null;
    renderPcMats(j.materials);
    if (!keepName) {
      PC_MAT = null; PC_SEGS = []; PC_SEL = -1;
      const v = $('pcPlayer'); v.pause(); v.removeAttribute('src'); v.src = ''; v.load();
      $('pcNote').textContent = '';
      renderPcSegs(); drawWave();
    }
    status(j.materials.length + ' 個素材');
  } catch (e) { status(e.message, true); }
}

function pcPick(m) {
  PC_MAT = m; PC_SEGS = []; PC_SEL = -1; pcSeek = null;
  if (pcTimer) { clearInterval(pcTimer); pcTimer = null; }
  if (pcExTimer) { clearInterval(pcExTimer); pcExTimer = null; }
  if (pcTrTimer) { clearInterval(pcTrTimer); pcTrTimer = null; }
  $('pcPlayer').src = '/media?name=' + encodeURIComponent(m.name);
  $('pcNote').textContent = m.offset ? ('母帶 offset +' + m.offset + ' 秒') : '檔名沒 6 碼 TC，offset＝0';
  $('pcMergeName').value = '';
  pcLoadStatus(false);
}

function pcWatchAnalyze(name) {
  name = name || (PC_MAT && PC_MAT.name);
  if (!name) return;
  clearInterval(pcTimer);
  pcTimer = setInterval(async () => {
    if (!PC_MAT || PC_MAT.name !== name) { clearInterval(pcTimer); pcTimer = null; return; }
    const j = await api('/api/precut/status?name=' + encodeURIComponent(name));
    status((j.phase || j.state) + (j.elapsed ? ' ' + j.elapsed + 's' : ''));
    if (j.state === 'done') {
      clearInterval(pcTimer); pcTimer = null;
      PC_SEGS = j.segments || []; renderPcSegs(); drawWave();
      status('分析完成 ' + PC_SEGS.length + ' 段');
    }
    if (j.state === 'error') { clearInterval(pcTimer); pcTimer = null; status(j.error, true); }
  }, 800);
}

function pcWatchExport(name) {
  name = name || (PC_MAT && PC_MAT.name);
  if (!name) return;
  clearInterval(pcExTimer);
  pcExTimer = setInterval(async () => {
    if (!PC_MAT || PC_MAT.name !== name) { clearInterval(pcExTimer); pcExTimer = null; return; }
    const s = await api('/api/precut/export/status?name=' + encodeURIComponent(name));
    if (s.state === 'done') {
      clearInterval(pcExTimer); pcExTimer = null;
      status('剪完 ' + (s.files||[]).length + ' 檔 → ' + (s.dir||''));
    }
    if (s.state === 'error') { clearInterval(pcExTimer); pcExTimer = null; status(s.error, true); }
  }, 800);
}

async function pcLoadStatus(startIfNone) {
  if (!PC_MAT) return;
  const name = PC_MAT.name;
  const j = await api('/api/precut/status?name=' + encodeURIComponent(name));
  if (!PC_MAT || PC_MAT.name !== name) return;
  if (j.state === 'done' && j.segments) {
    PC_SEGS = j.segments;
    if (j.stale) status('原片比快取新，建議重跑分析', false);
    renderPcSegs(); drawWave();
  } else if (j.state === 'running') {
    PC_SEGS = []; renderPcSegs();
    status((j.phase || j.state) + (j.elapsed ? ' ' + j.elapsed + 's' : ''));
    pcWatchAnalyze(name);
  } else if (j.state === 'error') {
    PC_SEGS = []; renderPcSegs();
    status(j.error, true);
  } else {
    PC_SEGS = []; renderPcSegs(); drawWave();
    if (startIfNone && j.state === 'none') pcAnalyze();
    else if (j.state === 'none') status('這支還沒分析——按「分析」（整點片約 1 小時，0 token）');
  }
  const ex = await api('/api/precut/export/status?name=' + encodeURIComponent(name));
  if (!PC_MAT || PC_MAT.name !== name) return;
  if (ex.state === 'running') pcWatchExport(name);
}

async function pcAnalyze() {
  if (!PC_MAT) return;
  const name = PC_MAT.name;
  status('分析中…');
  try {
    await api('/api/precut', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, force: true})});
  } catch (e) {
    status(e.message, true);
    const j = await api('/api/precut/status?name=' + encodeURIComponent(name)).catch(() => null);
    if (!j || j.state !== 'running') return;
  }
  if (!PC_MAT || PC_MAT.name !== name) return;
  pcWatchAnalyze(name);
}
$('pcAnalyze').onclick = pcAnalyze;

function pcWatchTranslate(name) {
  name = name || (PC_MAT && PC_MAT.name);
  if (!name) return;
  clearInterval(pcTrTimer);
  pcTrTimer = setInterval(async () => {
    if (!PC_MAT || PC_MAT.name !== name) { clearInterval(pcTrTimer); pcTrTimer = null; return; }
    const j = await api('/api/precut/translate/status?name=' + encodeURIComponent(name));
    status((j.phase || j.state) + (j.elapsed ? ' ' + j.elapsed + 's' : ''));
    if (j.state === 'done') {
      clearInterval(pcTrTimer); pcTrTimer = null;
      PC_SEGS = j.segments || PC_SEGS; renderPcSegs();
      status('翻譯完成');
    }
    if (j.state === 'error') { clearInterval(pcTrTimer); pcTrTimer = null; status(j.error, true); }
  }, 800);
}

async function pcTranslate() {
  if (!PC_MAT) return;
  if (!PC_SEGS.length) { status('還沒有分析結果，先按「分析」', true); return; }
  const name = PC_MAT.name;
  status('翻譯中…');
  try {
    await api('/api/precut/translate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name})});
  } catch (e) {
    status(e.message, true);
    return;
  }
  pcWatchTranslate(name);
}
$('pcTranslate').onclick = pcTranslate;

function pcDur(sec) {
  const n = Math.max(0, Math.round(Number(sec) || 0));
  if (n < 60) return n + '秒';
  const m = Math.floor(n / 60), r = n % 60;
  return r ? m + '分' + r + '秒' : m + '分';
}
function pcTopicKey(s) {
  const t = (s.topic || '').trim();
  return t || '（無字卡）';
}
function pcTopicIdxs(key) {
  return PC_SEGS.map((s, i) => pcTopicKey(s) === key ? i : -1).filter(i => i >= 0);
}
function pcTopicRuns() {
  const g = [];
  PC_SEGS.forEach((s, i) => {
    const key = pcTopicKey(s);
    if (!g.length || g[g.length - 1].key !== key) g.push({ key, idxs: [i] });
    else g[g.length - 1].idxs.push(i);
  });
  return g;
}
function renderPcSegs() {
  const runs = pcTopicRuns();
  const seen = new Set();
  let html = '';
  runs.forEach((g, gi) => {
    if (gi) html += '<div class="pcgap"></div>';
    const allIdx = pcTopicIdxs(g.key);
    if (!seen.has(g.key) && allIdx.length > 1) {
      seen.add(g.key);
      const allOn = allIdx.every(i => PC_SEGS[i].selected !== false);
      html += `<div class="pcpack"><label><input type="checkbox" data-pack="${esc(g.key)}" ${allOn ? 'checked' : ''}> ${esc(g.key)} · ${allIdx.length} 段（整組勾選）</label></div>`;
    } else {
      seen.add(g.key);
    }
    g.idxs.forEach(i => {
      const s = PC_SEGS[i];
      const zh = KIND_ZH[s.kind] || s.kind;
      const topic = (s.topic || '').trim();
      html += `<div class="pcseg ${s.kind}${i === PC_SEL ? ' on' : ''}" data-i="${i}">
        <input type="checkbox" ${s.selected !== false ? 'checked' : ''} data-chk="${i}">
        <div>
          <div class="topic${topic ? '' : ' empty'}">${esc(topic || '（無字卡）')}</div>
          <div class="meta"><span class="tag has">${esc(zh)}</span>${pcFmt(s.tc0)}–${pcFmt(s.tc1)} · ${pcDur(s.duration)}</div>
        </div>
      </div>`;
    });
  });
  $('pcSegs').innerHTML = html;
  $('pcSegs').querySelectorAll('[data-pack]').forEach(el => {
    const idxs = pcTopicIdxs(el.dataset.pack);
    const allOn = idxs.every(i => PC_SEGS[i].selected !== false);
    const someOn = idxs.some(i => PC_SEGS[i].selected !== false);
    el.indeterminate = someOn && !allOn;
    el.onchange = ev => {
      idxs.forEach(i => { PC_SEGS[i].selected = el.checked; });
      ev.stopPropagation();
      renderPcSegs();
    };
  });
  $('pcSegs').querySelectorAll('.pcseg').forEach(el => el.onclick = ev => {
    if (ev.target.dataset.chk != null) return;
    pcSelect(+el.dataset.i);
  });
  $('pcSegs').querySelectorAll('[data-chk]').forEach(el => el.onchange = ev => {
    PC_SEGS[+el.dataset.chk].selected = el.checked;
    ev.stopPropagation();
    renderPcSegs();
  });
}

function pcSelect(i) {
  PC_SEL = i;
  const s = PC_SEGS[i]; if (!s) return;
  renderPcSegs();
  $('pcKind').value = s.kind;
  $('pcTopic').value = s.topic || '';
  $('pcT0').value = sec2hhmmss6(s.t0);
  $('pcT1').value = sec2hhmmss6(s.t1);
  $('pcTc').textContent = '母帶 ' + pcFmt(s.tc0) + '–' + pcFmt(s.tc1);
  pcSeekTo(s.t0);
}
function pcSeekTo(t) {
  const v = $('pcPlayer');
  if (v.readyState >= 1) v.currentTime = t;
  else pcSeek = t;
}
$('pcPlayer').addEventListener('loadedmetadata', () => {
  if (pcSeek != null) { const t = pcSeek; pcSeek = null; pcSeekTo(t); }
});
$('pcKind').onchange = () => {
  if (PC_SEL<0) return;
  PC_SEGS[PC_SEL].kind = $('pcKind').value;
  const el = $('pcSegs').querySelector(`.pcseg[data-i="${PC_SEL}"]`);
  if (el) {
    el.className = `pcseg ${PC_SEGS[PC_SEL].kind}${PC_SEL === PC_SEL ? ' on' : ''}`;
    const tag = el.querySelector('.tag');
    if (tag) tag.textContent = KIND_ZH[PC_SEGS[PC_SEL].kind] || PC_SEGS[PC_SEL].kind;
  }
  drawWave();
};
$('pcTopic').oninput = () => {
  if (PC_SEL<0) return;
  PC_SEGS[PC_SEL].topic = $('pcTopic').value;
  const el = $('pcSegs').querySelector(`.pcseg[data-i="${PC_SEL}"] .topic`);
  if (el) el.textContent = $('pcTopic').value || '（無字卡）';
};
$('pcTopic').onchange = () => { if (PC_SEL>=0) renderPcSegs(); };
function pcRetime() {
  if (PC_SEL<0) return;
  const t0 = hhmmss62sec($('pcT0').value), t1 = hhmmss62sec($('pcT1').value);
  if (!Number.isNaN(t0)) PC_SEGS[PC_SEL].t0 = t0;
  if (!Number.isNaN(t1)) PC_SEGS[PC_SEL].t1 = t1;
  $('pcT0').value = sec2hhmmss6(PC_SEGS[PC_SEL].t0);
  $('pcT1').value = sec2hhmmss6(PC_SEGS[PC_SEL].t1);
}
$('pcT0').onchange = pcRetime; $('pcT1').onchange = pcRetime;

function drawWave() {
  const c = $('pcWave'); const w = c.parentElement.clientWidth || 800;
  c.width = w; const h = c.height; const ctx = c.getContext('2d');
  ctx.fillStyle = '#0e1013'; ctx.fillRect(0,0,w,h);
  if (!PC_SEGS.length) return;
  const T = Math.max(...PC_SEGS.map(s => s.t1), 1);
  PC_SEGS.forEach(s => {
    const x = s.t0 / T * w, ww = Math.max(2, (s.t1-s.t0)/T*w);
    ctx.fillStyle = KIND_COLOR[s.kind] || '#9aa2b1';
    ctx.globalAlpha = 0.45; ctx.fillRect(x, 8, ww, h-16); ctx.globalAlpha = 1;
  });
}
$('pcWave').onclick = ev => {
  if (!PC_SEGS.length) return;
  const T = Math.max(...PC_SEGS.map(s => s.t1), 1);
  const t = ev.offsetX / $('pcWave').width * T;
  const i = PC_SEGS.findIndex(s => t >= s.t0 && t < s.t1);
  if (i>=0) pcSelect(i);
};

async function pcSave() {
  if (!PC_MAT) return;
  const j = await api('/api/precut/save', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: PC_MAT.name, segments: PC_SEGS})});
  PC_SEGS = j.segments; renderPcSegs();
  status(j.overlap ? '已存（警告：段落邊界重疊）' : '已存 PRECUT.json', j.overlap);
}
$('pcSave').onclick = () => pcSave().catch(e => status(e.message, true));

async function pcExport(mode) {
  if (!PC_MAT) return;
  const name = PC_MAT.name;
  status('剪檔中…');
  try {
    const filename = mode === 'selected' ? $('pcMergeName').value.trim() : '';
    const j = await api('/api/precut/export', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, mode, accurate: $('pcAccurate').checked, segments: PC_SEGS, filename})});
    if (j.overlap) status('邊界重疊，仍繼續剪…');
  } catch (e) {
    status(e.message, true);
    const s = await api('/api/precut/export/status?name=' + encodeURIComponent(name)).catch(() => null);
    if (!s || s.state !== 'running') throw e;
  }
  if (!PC_MAT || PC_MAT.name !== name) return;
  pcWatchExport(name);
}
$('pcExportAll').onclick = () => pcExport('non_ad').catch(e => status(e.message, true));
$('pcExportSel').onclick = () => pcExport('selected').catch(e => status(e.message, true));
$('pcInvert').onclick = () => {
  PC_SEGS.forEach(s => { s.selected = false; });
  renderPcSegs();
};

$('load').onclick = loadDir;
$('dir').onkeydown = e => { if (e.key === 'Enter') loadDir(); };

(async () => {
  const j = await api('/api/materials').catch(() => null);
  if (j && j.dir) { $('dir').value = j.dir; renderPcMats(j.materials); status(j.materials.length + ' 個素材'); }
})();
</script>
