<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>掐BITE 工作台</title>
<style>
  :root {
    --bg:#14161a; --panel:#1d2027; --line:#2e333d; --fg:#e6e8ec; --dim:#9aa2b1;
    --accent:#4da3ff; --warn:#f0b429; --fail:#f2555a; --ok:#4cc38a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 10px 0 0; font-weight:600; }
  input[type=text] { background:#0e1013; color:var(--fg); border:1px solid var(--line);
                     border-radius:6px; padding:6px 9px; font:inherit; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#08121f; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  main { display:grid; grid-template-columns:260px 1fr 400px; gap:0; height:calc(100vh - 53px); }
  section { overflow:auto; padding:12px; }
  #materials { border-right:1px solid var(--line); }
  #right { border-left:1px solid var(--line); }
  .mat { padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  .mat:hover { border-color:var(--accent); }
  .mat.on { border-color:var(--accent); background:#1a2634; }
  .mat .n { font-size:12px; word-break:break-all; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px;
         background:#2a2f38; color:var(--dim); margin-right:4px; }
  .tag.has { background:#1e3a2c; color:var(--ok); }
  .tag.official { background:#173049; color:var(--accent); }
  .tag.warn { background:#3a2f14; color:var(--warn); }
  video { width:100%; max-height:340px; background:#000; border-radius:8px; }
  #filters { display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:12px;
             color:var(--dim); margin:8px 0; padding:6px 8px; background:var(--panel);
             border:1px solid var(--line); border-radius:6px; }
  #filters label { display:inline-flex; align-items:center; gap:4px; margin:0; cursor:pointer; }
  .seg { border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:8px; cursor:pointer; }
  .seg:hover { border-color:var(--accent); }
  .seg.on { border-color:var(--accent); background:#182430; }
  .seg .meta { font-size:12px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .seg .txt { margin-top:4px; }
  .seg .zht { margin-top:2px; color:var(--dim); font-size:13px; }
  .flag { font-size:12px; margin-top:4px; color:var(--warn); }
  .flag.fail { color:var(--fail); }
  .note { font-size:12px; color:var(--dim); border-left:2px solid var(--line);
          padding-left:8px; margin:6px 0 12px; }
  label { display:block; font-size:12px; color:var(--dim); margin:9px 0 3px; }
  textarea { width:100%; background:#0e1013; color:var(--fg); border:1px solid var(--line);
             border-radius:6px; padding:7px 9px; font:inherit; resize:vertical; }
  #out { white-space:pre-wrap; background:#0e1013; border:1px solid var(--line);
         border-radius:6px; padding:10px; margin-top:8px; min-height:70px; font-size:13px; }
  .lint { font-size:12px; margin-top:6px; }
  .lint .f { color:var(--fail); } .lint .w { color:var(--warn); }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  #status { font-size:12px; color:var(--dim); margin-left:auto; max-width:50%; }
  #tabs { display:flex; gap:0; }
  .tab { border-radius:6px 6px 0 0; }
  .tab.on { background:var(--accent); color:#08121f; font-weight:600; }
  #viewPrecut { display:grid; grid-template-columns:260px 1fr; height:calc(100vh - 53px); }
  #viewPrecut[hidden] { display:none !important; }
  #viewBite[hidden] { display:none !important; }
  #pcTop { display:grid; grid-template-columns:1.2fr 1fr; gap:8px; }
  #pcPlayer { width:100%; max-height:280px; background:#000; border-radius:8px; }
  #pcWave { width:100%; display:block; background:#0e1013; border:1px solid var(--line); border-radius:6px; margin:8px 0; cursor:pointer; }
  .pcseg { display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:6px; cursor:pointer; }
  .pcseg.on { border-color:var(--accent); background:#182430; }
  .pcseg.ad { border-color:#5a2a2a; }
</style>
</head>
<body>
<header>
  <nav id="tabs">
    <button type="button" id="tabBtnBite" class="tab on">掐BITE</button>
    <button type="button" id="tabBtnPrecut" class="tab">側錄初處理</button>
  </nav>
  <input type="text" id="dir" size="52" placeholder="素材資料夾路徑">
  <button id="load">讀取</button>
  <span id="status"></span>
</header>

<main id="viewBite">
  <section id="materials"></section>

  <section id="center">
    <video id="player" controls preload="metadata"></video>
    <div class="row" style="margin:8px 0">
      <button id="transcribe">跑轉錄（whisper.cpp + VAD）</button>
      <button id="resegment">重列段落</button>
    </div>
    <div id="note" class="note"></div>
    <div id="filters" style="display:none">
      <span id="segcount"></span>
      <label><input type="checkbox" id="f_official">只看官方引言</label>
      <label><input type="checkbox" id="f_short">隱藏 8 秒以下</label>
      <label><input type="checkbox" id="f_handoff">隱藏疑似交接語</label>
    </div>
    <div id="segs"></div>
  </section>

  <section id="right">
    <strong>產生 SB</strong>
    <div class="note">第 3 行中文翻譯由 AI 產草稿（殘譯與括號主詞仍要人核）。第 5 行原文有官方稿時逐字取自官方稿，ASR 只用來定位時間。</div>
    <label>第 2 行 職稱 姓名（SUPER：姓名英文原名、職稱中文）</label>
    <input type="text" id="speaker" style="width:100%">
    <label>第 3 行 中文翻譯（不帶「」；代名詞指涉不明用半形括號補主詞）</label>
    <textarea id="zh" rows="4"></textarea>
    <button id="translate" style="width:100%">AI 翻譯（Claude）</button>
    <label>第 5 行 原文逐字</label>
    <textarea id="original" rows="4"></textarea>
    <div class="row">
      <div><label>TC 起（秒）</label><input type="text" id="start" style="width:100%"></div>
      <div><label>TC 訖（秒）</label><input type="text" id="end" style="width:100%"></div>
    </div>
    <div class="row" id="siderow" style="display:none">
      <div><label>側錄來源</label><input type="text" id="source" style="width:100%" placeholder="CNN"></div>
      <div><label>母帶日期 M/D</label><input type="text" id="md" style="width:100%" placeholder="7/28"></div>
    </div>
    <button class="primary" id="gen" style="margin-top:12px;width:100%">產生五行（中文空白時先自動翻譯）</button>
    <div id="out"></div>
    <div id="lint" class="lint"></div>
    <button id="copy" style="margin-top:8px;width:100%">複製</button>
  </section>
</main>

<main id="viewPrecut" hidden>
  <section id="pcMats"></section>
  <section id="pcMain">
    <div id="pcTop">
      <video id="pcPlayer" controls preload="metadata"></video>
      <div id="pcForm">
        <div class="note" id="pcNote">不跑 ASR。分析用靜音＋下標 OCR，類型請人改。</div>
        <label>類型</label>
        <select id="pcKind">
          <option value="ad">廣告</option>
          <option value="anchor">主播</option>
          <option value="reporter">記者</option>
          <option value="interview">訪問</option>
          <option value="other">其他</option>
        </select>
        <label>主題（字卡，可改）</label>
        <input type="text" id="pcTopic" style="width:100%">
        <div class="row">
          <div><label>檔內起（秒）</label><input type="text" id="pcT0"></div>
          <div><label>檔內訖（秒）</label><input type="text" id="pcT1"></div>
        </div>
        <div id="pcTc" class="note"></div>
        <label><input type="checkbox" id="pcAccurate">精準重編（慢，切點對齊秒）</label>
        <div class="row" style="margin-top:8px">
          <button id="pcAnalyze">分析</button>
          <button class="primary" id="pcExportAll">一鍵出全部非廣告</button>
          <button id="pcExportSel">只出勾選</button>
          <button id="pcSave">存回 PRECUT.json</button>
        </div>
      </div>
    </div>
    <canvas id="pcWave" height="72"></canvas>
    <div id="pcSegs"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let MAT = null, SEGS = [], SEL = -1, stopAt = null, pendingSeek = null, pollTimer = null, zhTimer = null, TR_WARN = '';
const NLLB_HINT = '[WARN] NLLB 草稿：已知會掉句尾（殘譯）且用詞生硬——請逐句對照第 5 行原文核對，缺的自己補';

const status = (t, err) => { $('status').textContent = t; $('status').style.color = err ? 'var(--fail)' : 'var(--dim)'; };

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({ detail: r.statusText }));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || '請求失敗'));
  return j;
}

async function loadDir() {
  const dir = $('dir').value.trim();
  status('讀取中…');
  try {
    const j = await api('/api/materials?dir=' + encodeURIComponent(dir));
    renderMaterials(j.materials);
    status(j.materials.length + ' 個素材');
  } catch (e) { status(e.message, true); }
}

function renderMaterials(list) {
  $('materials').innerHTML = list.map((m, i) =>
    `<div class="mat" data-i="${i}">
       <div class="n">${esc(m.name)}</div>
       <div style="margin-top:4px">
         <span class="tag">${m.kind === 'numbered' ? '#' + m.material_no : m.kind === 'side' ? '側錄' : '無編號'}</span>
         ${m.offset ? `<span class="tag">offset ${hhmmss(m.offset)}</span>` : ''}
         ${m.script_path ? '<span class="tag has">有文稿</span>' : '<span class="tag">無文稿</span>'}
         ${m.has_asr ? '<span class="tag has">有ASR</span>' : ''}
         ${m.has_subtitle ? '<span class="tag has">有字幕</span>' : ''}
       </div>
     </div>`).join('');
  $('materials').querySelectorAll('.mat').forEach(el =>
    el.onclick = () => pickMaterial(list[+el.dataset.i], el));
}

function pickMaterial(m, el) {
  MAT = m; SEL = -1; SEGS = []; stopAt = null; pendingSeek = null;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (zhTimer) { clearInterval(zhTimer); zhTimer = null; }
  $('materials').querySelectorAll('.mat').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  $('player').src = '/media?name=' + encodeURIComponent(m.name);
  $('siderow').style.display = m.kind === 'side' ? 'flex' : 'none';
  if (m.source) $('source').value = m.source;
  if (m.md) $('md').value = m.md;
  $('segs').innerHTML = ''; $('note').textContent = ''; $('filters').style.display = 'none';
  if (m.has_asr || m.has_subtitle) loadSegments();
  else $('note').textContent = '這支還沒有時間軸來源（無字幕、無 ASR）——按「跑轉錄」。';
}

// ---- 轉錄：啟動背景工作＋輪詢，不再同步乾等 160 秒 ----
async function transcribe() {
  if (!MAT) return status('先選一支素材', true);
  $('transcribe').disabled = true;
  try {
    const j = await api('/api/transcribe', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: MAT.name })
    });
    if (j.state === 'done') {           // 已有旁路 ASR 檔
      MAT.has_asr = true; $('transcribe').disabled = false;
      status(j.note || '已有 ASR'); return loadSegments();
    }
    status('轉錄啟動…（8 分鐘片約 25 秒、65 分鐘片約 165 秒）');
    pollTimer = setInterval(pollTranscribe, 2000);
  } catch (e) { status(e.message, true); $('transcribe').disabled = false; }
}

async function pollTranscribe() {
  try {
    const j = await api('/api/transcribe/status?name=' + encodeURIComponent(MAT.name));
    if (j.state === 'running') {
      status(`轉錄中：${j.phase || ''}（已 ${Math.round(j.elapsed || 0)} 秒）`);
    } else {
      clearInterval(pollTimer); pollTimer = null; $('transcribe').disabled = false;
      if (j.state === 'done') {
        MAT.has_asr = true;
        status(`轉錄完成：${j.segments} 段／${j.words} 個詞級時間點`);
        await loadSegments();
      } else {
        status('轉錄失敗：' + (j.error || '未知錯誤'), true);
      }
    }
  } catch (e) { clearInterval(pollTimer); pollTimer = null; $('transcribe').disabled = false; status(e.message, true); }
}

async function loadSegments() {
  if (!MAT) return;
  try {
    const j = await api('/api/segments?name=' + encodeURIComponent(MAT.name));
    SEGS = j.segments;
    const srcs = (j.tc_sources || []).map(s =>
      `<span class="tag${s.available ? ' has' : ''}">${s.rank}. ${esc(s.label)}${s.available ? ' ✓' : ''}</span>`).join('');
    $('note').innerHTML = `<div>時間軸來源：${esc(j.timeline_note || '')}</div>
      <div style="margin:4px 0">${srcs}</div><div>${esc(j.note)}</div>`;
    $('filters').style.display = 'flex';
    renderSegments();
    ensureBatchZh();
  } catch (e) { status(e.message, true); $('segs').innerHTML = ''; }
}

// ---- 批次翻譯：段落載入後自動補中文（NLLB 本機、進快取，翻過不重翻）----
async function ensureBatchZh() {
  if (!SEGS.some(s => s.text && !s.zh) || zhTimer) return;
  const name = MAT.name;
  try {
    const j = await api('/api/translate_all', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name })
    });
    if (j.state !== 'running') return;
    zhTimer = setInterval(async () => {
      if (!MAT || MAT.name !== name) { clearInterval(zhTimer); zhTimer = null; return; }
      try {
        const st = await api('/api/translate_all/status?name=' + encodeURIComponent(name));
        if (st.state === 'running') {
          status(`批次翻譯中（NLLB）：${st.done}／${st.total} 句`);
          await refreshZh();
        } else {
          clearInterval(zhTimer); zhTimer = null;
          await refreshZh();
          status(st.state === 'done' ? '批次翻譯完成——NLLB 草稿可能殘譯，用前請對照原文'
                                     : '批次翻譯失敗：' + (st.error || ''), st.state !== 'done');
        }
      } catch (e) { clearInterval(zhTimer); zhTimer = null; status(e.message, true); }
    }, 3000);
  } catch (e) { status(e.message, true); }
}

async function refreshZh() {   // 只更新 zh 欄位，不動選取狀態與播放
  const j = await api('/api/segments?name=' + encodeURIComponent(MAT.name));
  j.segments.forEach((s, i) => { if (SEGS[i]) SEGS[i].zh = s.zh; });
  renderSegments();
}

function visibleSegs() {
  return SEGS.map((s, i) => [s, i]).filter(([s]) => {
    if ($('f_official').checked && s.origin !== 'official') return false;
    if ($('f_short').checked && s.end > s.start && s.duration < 8) return false;
    if ($('f_handoff').checked && (s.tags || []).includes('疑似交接語')) return false;
    return true;
  });
}

function renderSegments() {
  const vis = visibleSegs();
  $('segcount').textContent = `顯示 ${vis.length}／全部 ${SEGS.length} 段`;
  $('segs').innerHTML = vis.map(([s, i]) => {
    const tags = (s.tags || []).map(t =>
      `<span class="tag${t === '官方引言' ? ' official' : t === '疑似交接語' || t === '>25秒' ? ' warn' : ''}">${esc(t)}</span>`).join('');
    const flags = (s.flags || []).map(f =>
      `<div class="flag${f.includes('FAIL') || f.includes('定位失敗') ? ' fail' : ''}">${esc(f)}</div>`).join('');
    return `<div class="seg${i === SEL ? ' on' : ''}" data-i="${i}">
      <div class="meta">
        <span>${s.end > s.start ? mmss(s.start) + '–' + mmss(s.end) : 'TC 未定'}</span>
        <span>${s.duration ? s.duration.toFixed(1) + '秒' : ''}</span>
        ${tags}
        ${s.confidence !== null ? `<span>命中 ${Math.round(s.confidence * 100)}%</span>` : ''}
        ${s.speaker_hint ? `<span>${esc(s.speaker_hint)}</span>` : ''}
      </div>
      <div class="txt">${esc(s.text.slice(0, 300))}${s.text.length > 300 ? '…' : ''}</div>
      ${s.zh ? `<div class="zht">譯 ${esc(s.zh.slice(0, 150))}${s.zh.length > 150 ? '…' : ''}</div>` : ''}
      ${flags}
    </div>`;
  }).join('');
  [...document.querySelectorAll('.seg')].forEach(el =>
    el.onclick = () => pickSegment(+el.dataset.i, el));
}

function pickSegment(i, el) {
  const s = SEGS[i];
  document.querySelectorAll('.seg').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  $('start').value = s.start.toFixed(2);
  $('end').value = s.end.toFixed(2);
  $('original').value = s.text;
  if (i !== SEL) {
    // 換段落：有批次翻譯就預填（NLLB 草稿，警語照掛）；重點同段落只是回看畫面
    $('zh').value = s.zh || '';
    TR_WARN = s.zh ? NLLB_HINT : '';
    $('speaker').value = s.speaker_hint || ''; // 無 hint 也要清空，否則殘留上一位講者
  }
  SEL = i;
  // 點列即跳 TC 播放——這一步就是輸出前的人工核對（計畫書 §4.1）
  if (s.end > s.start) seekPlay(Math.max(0, s.start - 0.3), s.end + 0.3);
}

// 剛換素材時 <video> 可能還沒 loadedmetadata，直接設 currentTime 會被
// 靜默忽略——metadata 未就緒就先記下來，等 loadedmetadata 再補跳。
function seekPlay(t, stop) {
  const p = $('player');
  if (p.readyState >= 1) { p.currentTime = t; stopAt = stop; p.play(); }
  else pendingSeek = [t, stop];
}
$('player').addEventListener('loadedmetadata', () => {
  if (pendingSeek) { const [t, stop] = pendingSeek; pendingSeek = null; seekPlay(t, stop); }
});
$('player').addEventListener('timeupdate', () => {
  if (stopAt !== null && $('player').currentTime >= stopAt) { $('player').pause(); stopAt = null; }
});

// ---- 中文翻譯（後端呼叫 Claude；Key 不進 HTML）----
async function translateZh() {
  const text = $('original').value.trim();
  if (!text) { status('第 5 行原文是空的，沒東西可翻', true); return false; }
  $('translate').disabled = true;
  status('AI 翻譯中…');
  try {
    const ctx = SEL >= 0 ? [SEGS[SEL - 1], SEGS[SEL + 1]]
      .filter(Boolean).map(s => s.asr_text || s.text).join(' … ') : '';
    const j = await api('/api/translate', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, speaker: $('speaker').value, context: ctx })
    });
    $('zh').value = j.zh;
    TR_WARN = j.warning ? '[WARN] ' + j.warning + '（引擎：' + j.engine + '）' : '';
    status('翻譯完成（' + j.engine + '）——' + (j.warning || '殘譯與括號主詞請自行核對'), !!j.warning);
    return true;
  } catch (e) { status('翻譯失敗：' + e.message, true); return false; }
  finally { $('translate').disabled = false; }
}

async function generate() {
  if (!MAT) return status('先選一支素材', true);
  if (!$('zh').value.trim()) {
    const ok = await translateZh();       // 需求：中文翻譯要自動產生，不留白
    if (!ok) return;
  }
  try {
    const j = await api('/api/sb', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        name: MAT.name, start: parseFloat($('start').value), end: parseFloat($('end').value),
        speaker: $('speaker').value, zh: $('zh').value, original: $('original').value,
        source: $('source').value, md: $('md').value
      })
    });
    $('out').textContent = j.text;
    $('lint').innerHTML = (j.lint || []).concat(TR_WARN ? [TR_WARN] : []).map(m =>
      `<div class="${m.startsWith('[FAIL]') ? 'f' : 'w'}">${esc(m)}</div>`).join('');
    status('已產生');
  } catch (e) { status(e.message, true); }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const mmss = s => pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60));
const hhmmss = s => pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(Math.floor(s % 60));

$('load').onclick = loadDir;
$('dir').onkeydown = e => { if (e.key === 'Enter') loadDir(); };
$('transcribe').onclick = transcribe;
$('resegment').onclick = loadSegments;
$('translate').onclick = translateZh;
$('gen').onclick = generate;
$('copy').onclick = () => { navigator.clipboard.writeText($('out').textContent); status('已複製'); };
['f_official', 'f_short', 'f_handoff'].forEach(id => $(id).onchange = renderSegments);

let PC_MAT = null, PC_SEGS = [], PC_SEL = -1, pcSeek = null, pcTimer = null, pcExTimer = null;
const KIND_ZH = {ad:'廣告', anchor:'主播', reporter:'記者', interview:'訪問', other:'其他'};
const KIND_COLOR = {ad:'#f2555a', anchor:'#4da3ff', reporter:'#f0b429', interview:'#4cc38a', other:'#9aa2b1'};

function showTab(which) {
  const bite = which === 'bite';
  $('viewBite').hidden = !bite;
  $('viewPrecut').hidden = bite;
  $('tabBtnBite').classList.toggle('on', bite);
  $('tabBtnPrecut').classList.toggle('on', !bite);
  if (!bite) drawWave();
}
$('tabBtnBite').onclick = () => showTab('bite');
$('tabBtnPrecut').onclick = () => showTab('precut');

function pcFmt(tc) { return tc ? tc.slice(0,2)+':'+tc.slice(2,4)+':'+tc.slice(4,6) : ''; }

function renderPcMats(list) {
  $('pcMats').innerHTML = list.map((m,i) =>
    `<div class="mat" data-i="${i}"><div class="n">${m.name}</div>
     <span class="tag">${m.kind}</span>
     ${m.offset ? `<span class="tag has">offset ${m.offset}</span>` : `<span class="tag warn">無 6 碼 TC</span>`}
    </div>`).join('');
  $('pcMats').querySelectorAll('.mat').forEach(el => el.onclick = () => pcPick(list[+el.dataset.i]));
}

const _renderMaterials = renderMaterials;
renderMaterials = function(list) {
  _renderMaterials(list);
  renderPcMats(list);
};

function pcPick(m) {
  PC_MAT = m; PC_SEGS = []; PC_SEL = -1;
  $('pcPlayer').src = '/media?name=' + encodeURIComponent(m.name);
  $('pcNote').textContent = m.offset ? ('母帶 offset +' + m.offset + ' 秒') : '檔名沒 6 碼 TC，offset＝0';
  pcLoadStatus(false);
}

async function pcLoadStatus(startIfNone) {
  if (!PC_MAT) return;
  const j = await api('/api/precut/status?name=' + encodeURIComponent(PC_MAT.name));
  if (j.state === 'done' && j.segments) {
    PC_SEGS = j.segments;
    if (j.stale) status('原片比快取新，建議重跑分析', false);
    renderPcSegs(); drawWave();
    return;
  }
  if (startIfNone && j.state === 'none') pcAnalyze();
}

async function pcAnalyze() {
  if (!PC_MAT) return;
  status('分析中…');
  try {
    await api('/api/precut', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name: PC_MAT.name, force: true})});
  } catch (e) { status(e.message, true); return; }
  clearInterval(pcTimer);
  pcTimer = setInterval(async () => {
    const j = await api('/api/precut/status?name=' + encodeURIComponent(PC_MAT.name));
    status((j.phase || j.state) + (j.elapsed ? ' ' + j.elapsed + 's' : ''));
    if (j.state === 'done') {
      clearInterval(pcTimer); PC_SEGS = j.segments || []; renderPcSegs(); drawWave();
      status('分析完成 ' + PC_SEGS.length + ' 段');
    }
    if (j.state === 'error') { clearInterval(pcTimer); status(j.error, true); }
  }, 800);
}
$('pcAnalyze').onclick = pcAnalyze;

function renderPcSegs() {
  $('pcSegs').innerHTML = PC_SEGS.map((s,i) =>
    `<div class="pcseg ${s.kind}${i===PC_SEL?' on':''}" data-i="${i}">
      <input type="checkbox" ${s.selected!==false?'checked':''} data-chk="${i}">
      <div>
        <div class="meta">${KIND_ZH[s.kind]||s.kind} · ${pcFmt(s.tc0)}–${pcFmt(s.tc1)} · ${s.duration}s</div>
        <div>${s.topic || '（無字卡）'}</div>
      </div>
    </div>`).join('');
  $('pcSegs').querySelectorAll('.pcseg').forEach(el => el.onclick = ev => {
    if (ev.target.dataset.chk != null) return;
    pcSelect(+el.dataset.i);
  });
  $('pcSegs').querySelectorAll('[data-chk]').forEach(el => el.onchange = ev => {
    PC_SEGS[+el.dataset.chk].selected = el.checked;
    ev.stopPropagation();
  });
}

function pcSelect(i) {
  PC_SEL = i;
  const s = PC_SEGS[i]; if (!s) return;
  renderPcSegs();
  $('pcKind').value = s.kind;
  $('pcTopic').value = s.topic || '';
  $('pcT0').value = s.t0;
  $('pcT1').value = s.t1;
  $('pcTc').textContent = '母帶 ' + pcFmt(s.tc0) + '–' + pcFmt(s.tc1);
  const v = $('pcPlayer');
  const go = () => { v.currentTime = s.t0; };
  if (v.readyState >= 1) go(); else { pcSeek = s.t0; v.onloadedmetadata = () => { if (pcSeek!=null) v.currentTime = pcSeek; }; }
}
$('pcKind').onchange = () => { if (PC_SEL>=0) { PC_SEGS[PC_SEL].kind = $('pcKind').value; renderPcSegs(); drawWave(); } };
$('pcTopic').oninput = () => { if (PC_SEL>=0) PC_SEGS[PC_SEL].topic = $('pcTopic').value; };
function pcRetime() {
  if (PC_SEL<0) return;
  PC_SEGS[PC_SEL].t0 = parseFloat($('pcT0').value);
  PC_SEGS[PC_SEL].t1 = parseFloat($('pcT1').value);
}
$('pcT0').onchange = pcRetime; $('pcT1').onchange = pcRetime;

function drawWave() {
  const c = $('pcWave'); const w = c.parentElement.clientWidth || 800;
  c.width = w; const h = c.height; const ctx = c.getContext('2d');
  ctx.fillStyle = '#0e1013'; ctx.fillRect(0,0,w,h);
  if (!PC_SEGS.length) return;
  const T = Math.max(...PC_SEGS.map(s => s.t1), 1);
  PC_SEGS.forEach(s => {
    const x = s.t0 / T * w, ww = Math.max(2, (s.t1-s.t0)/T*w);
    ctx.fillStyle = KIND_COLOR[s.kind] || '#9aa2b1';
    ctx.globalAlpha = 0.45; ctx.fillRect(x, 8, ww, h-16); ctx.globalAlpha = 1;
  });
}
$('pcWave').onclick = ev => {
  if (!PC_SEGS.length) return;
  const T = Math.max(...PC_SEGS.map(s => s.t1), 1);
  const t = ev.offsetX / $('pcWave').width * T;
  const i = PC_SEGS.findIndex(s => t >= s.t0 && t < s.t1);
  if (i>=0) pcSelect(i);
};

async function pcSave() {
  if (!PC_MAT) return;
  const j = await api('/api/precut/save', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: PC_MAT.name, segments: PC_SEGS})});
  PC_SEGS = j.segments; renderPcSegs();
  status(j.overlap ? '已存（警告：段落邊界重疊）' : '已存 PRECUT.json', j.overlap);
}
$('pcSave').onclick = () => pcSave().catch(e => status(e.message, true));

async function pcExport(mode) {
  if (!PC_MAT) return;
  status('剪檔中…');
  const j = await api('/api/precut/export', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: PC_MAT.name, mode, accurate: $('pcAccurate').checked, segments: PC_SEGS})});
  if (j.overlap) status('邊界重疊，仍繼續剪…');
  clearInterval(pcExTimer);
  pcExTimer = setInterval(async () => {
    const s = await api('/api/precut/export/status?name=' + encodeURIComponent(PC_MAT.name));
    if (s.state === 'done') {
      clearInterval(pcExTimer);
      status('剪完 ' + (s.files||[]).length + ' 檔 → ' + (s.dir||''));
    }
    if (s.state === 'error') { clearInterval(pcExTimer); status(s.error, true); }
  }, 800);
}
$('pcExportAll').onclick = () => pcExport('non_ad').catch(e => status(e.message, true));
$('pcExportSel').onclick = () => pcExport('selected').catch(e => status(e.message, true));

showTab('bite');

(async () => {
  const j = await api('/api/materials').catch(() => null);
  if (j && j.dir) { $('dir').value = j.dir; renderMaterials(j.materials); status(j.materials.length + ' 個素材'); }
})();
</script>
</body>
</html>
